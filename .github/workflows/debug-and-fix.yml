name: Debug and auto-fix

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  debug-and-fix:
    name: Auto-fix (lint & format), type-check & build
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint (auto-fix where possible)
        run: |
          npm run lint -- --fix || npm run lint

      - name: Auto-format with Prettier
        run: npm run format

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Detect changes
        id: detect-changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push automated fixes
        if: steps.detect-changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: apply automated formatting and checks" || exit 0
          git push